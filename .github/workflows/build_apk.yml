name: Build Study Room APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Create missing platform scaffolding (android/ios) while keeping custom files
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml.bak || true
          flutter create --org com.junaid.studyroom --project-name study_room_app .
          cp /tmp/AndroidManifest.xml.bak android/app/src/main/AndroidManifest.xml || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Launcher Icon
        run: dart run flutter_launcher_icons || true

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Study-Room-Junaid-APK
          path: build/app/outputs/flutter-apk/app-release.apk
